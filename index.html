<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的作品集</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #12121a;
      --bg-card-hover: #1a1a25;
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.3);
      --text-primary: #ffffff;
      --text-secondary: #8a8a9a;
      --border: #2a2a3a;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Background effect */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-glow), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(120, 0, 255, 0.15), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px 40px;
      position: relative;
      z-index: 1;
    }
    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInUp 0.8s ease-out;
    }
    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto;
    }
    /* Button */
    .cta-btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--bg-primary);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px var(--accent-glow), 0 8px 30px rgba(0, 0, 0, 0.3);
    }
    .cta-btn:active { transform: translateY(0); }
    /* Projects */
    .projects { margin-bottom: 60px; }
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 24px;
      text-align: center;
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s ease;
      animation: fadeInUp 0.8s ease-out backwards;
    }
    .project-card:nth-child(1) { animation-delay: 0.1s; }
    .project-card:nth-child(2) { animation-delay: 0.2s; }
    .project-card:nth-child(3) { animation-delay: 0.3s; }
    .project-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-4px);
    }
    .project-card h3 {
      font-size: 1.15rem;
      margin-bottom: 8px;
    }
    .project-card p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .project-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.2s ease;
    }
    .project-link:hover { gap: 10px; }
    /* Social */
    .social {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 60px;
      animation: fadeInUp 0.8s ease-out 0.4s backwards;
    }
    .social-link {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .social-link:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .social-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    /* Footer */
    .footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 600px) {
      .container { padding: 40px 16px 30px; }
      .hero { margin-bottom: 40px; }
      .project-grid { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>AI Builder</h1>
      <p>全栈工程师 / AI 爱好者，热爱构建有价值的产品</p>
      <button class="cta-btn" onclick="alert('成功！你已经会做网站了')">点击我</button>

    <section class="projects">

        <article class="project-card">

    </section>

    </nav>

    <footer class="footer">
      下一步：帮我把这个站点免费上线
    </footer>
  </div>
</body>
</html>
